name: Relatar bug
description: Algo não funciona como deveria.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar. **Não cole dados pessoais de candidatos, senhas nem conteúdo do `.env`.**
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Entrar como recrutador
        2. Abrir /recrutamento/vagas
        3. ...
    validations:
      required: true
  - type: dropdown
    id: perfil
    attributes:
      label: Perfil afetado
      options:
        - Candidato
        - Recrutador
        - Admin
        - Visitante (sem login)
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Onde
      options:
        - Produção (cl-tech-pi.vercel.app)
        - Local (pnpm dev:setup)
        - CI
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador e tamanho de tela
      placeholder: Chrome 130, 360 px
  - type: textarea
    id: logs
    attributes:
      label: Logs ou prints
      description: Mensagem de erro, código do erro da API (ex. VALIDATION_ERROR), saída do terminal.
      render: shell
