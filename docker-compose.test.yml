# Postgres efêmero para os testes de integração (research.md R8).
# Porta diferente do banco de dev para rodar os dois ao mesmo tempo.
services:
  db-test:
    image: postgres:16-alpine
    container_name: cltech-db-test
    environment:
      POSTGRES_USER: cltech
      POSTGRES_PASSWORD: cltech
      POSTGRES_DB: cltech_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cltech -d cltech_test"]
      interval: 5s
      timeout: 5s
      retries: 10
